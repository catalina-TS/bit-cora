<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora.exe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla de arranque: simula un inicio de sesión, con mi misma
       estética retro (no copio ningún programa real) - el correo se
       "tipea" letra por letra y la clave aparece en puntitos, con calma,
       antes de apretar "Sign in" y abrir la página de verdad. Lo maneja
       mostrarArranque() en script.js. Se puede saltar con un clic. -->
  <div class="pantalla-arranque" id="pantalla-arranque">
    <div class="login-caja">
      <div class="login-avatar">
        <svg viewBox="0 0 18 18" width="34" height="34" fill="none" stroke="#141414" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg>
      </div>
      <p class="login-titulo">Iniciar sesión</p>
      <p class="login-sub">Inicia sesión para entrar a BITÁCORA.EXE</p>
      <div class="login-campo" id="login-correo"></div>
      <div class="login-campo" id="login-clave"></div>
      <button class="btn-retro login-boton" id="login-boton">Sign in</button>
      <p class="arranque-hint">(clic para saltar)</p>
    </div>
  </div>

  <!-- Ventana fija: es la página completa, no se abre desde un escritorio.
       Todo lo que ve la usuaria vive adentro de esta ventana. -->
  <div class="ventana" id="ventana">
    <!-- Barra de título falsa, estilo ventana de Windows/Mac viejo. Los
         "puntos" son solo decorativos, no cierran/minimizan nada de verdad. -->
    <div class="barra-titulo">
      <div class="botones">
        <span class="punto llena"></span>
        <span class="punto"></span>
        <span class="punto"></span>
      </div>
      <span class="titulo">BITÁCORA.EXE</span>
      <!-- Reloj en vivo, como la barra de tareas de un SO viejo - lo
           actualiza actualizarReloj() en script.js cada segundo. Mismo
           ancho que .botones (90px) para que "BITÁCORA.EXE" siga centrado. -->
      <span class="espacio" id="reloj"></span>
    </div>
    <div class="cuerpo">
      <!-- Sidebar: acá script.js dibuja la lista "ARCHIVO" con las 6
           categorías (construirSidebar() en script.js llena este <ul>). -->
      <aside class="sidebar">
        <p class="sidebar-titulo">ARCHIVO</p>
        <ul class="lista-categorias" id="lista-categorias"></ul>
      </aside>
      <!-- Contenido: el nombre de la categoría abierta + el contador de
           entradas se llenan en mostrarGaleria() (script.js). El <div id="galeria">
           es el "lienzo" que se reescribe entero cada vez que cambio de vista
           (galería, ficha o formulario) - todo pasa por su .innerHTML. -->
      <div class="contenido">
        <div class="contenido-header">
          <h2 id="titulo-categoria"></h2>
          <span class="contador" id="contador-entradas"></span>
        </div>
        <div class="galeria" id="galeria"></div>
      </div>
    </div>
  </div>

  <!-- script.js se conecta a mi backend (bit-cora-backend, en localhost:3000
       mientras desarrollo) para guardar y leer las entradas - ya NO usa
       localStorage. Necesita que "node index.js" esté corriendo para funcionar. -->
  <script src="script.js"></script>
</body>
</html>
